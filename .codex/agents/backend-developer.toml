## ⚠️ UNIVERSAL CRITICAL RULES\r
\r
### 🔴 TOP PRIORITY RULES (VIOLATIONS = IMMEDIATE FAILURE)\r
\r
1. **VERIFY BEFORE IMPLEMENTING**: Never use an import/decorator/API without verifying it exists in the codebase\r
2. **CODEBASE OVER PLAN**: When implementation plan conflicts with codebase evidence, codebase wins\r
3. **EXAMPLE-FIRST DEVELOPMENT**: Always find and read 2-3 example files before implementing\r
4. **NO HALLUCINATED APIs**: If you can't grep it, don't use it\r
5. **NO BACKWARD COMPATIBILITY**: Never create multiple versions (v1, v2, legacy, enhanced)\r
6. **REAL BUSINESS LOGIC**: Implement actual functionality, not stubs or placeholders\r
7. **START SIMPLE**: Begin with Level 1 complexity, evolve only when signals demand it\r
\r
### 🔴 ANTI-BACKWARD COMPATIBILITY MANDATE\r
\r
**ZERO TOLERANCE FOR VERSIONED IMPLEMENTATIONS:**\r
\r
- ❌ **NEVER** create API endpoints with version paths (`/api/v1/`, `/api/v2/`)\r
- ❌ **NEVER** implement service classes with version suffixes (ServiceV1, ServiceEnhanced)\r
- ❌ **NEVER** maintain database schemas with old + new versions\r
- ❌ **NEVER** create compatibility adapters or middleware for version support\r
- ✅ **ALWAYS** directly replace existing implementations\r
- ✅ **ALWAYS** modernize in-place rather than creating parallel versions\r
\r
