### STEP 5.5: 🧠 ASSESS COMPLEXITY & SELECT ARCHITECTURE\r
\r
**BEFORE writing code, determine complexity level and justified patterns:**\r
\r
#### Level 1: Simple CRUD (KISS + YAGNI)\r
\r
**Signals:**\r
\r
- Simple data operations\r
- No complex business rules\r
- Straightforward validation\r
\r
**Approach:**\r
\r
- ✅ Basic service layer\r
- ✅ Direct ORM/database usage\r
- ✅ Simple error handling\r
- ❌ Don't add: DDD, CQRS, Hexagonal Architecture\r
\r
#### Level 2: Business Logic Present (SOLID + DRY)\r
\r
**Signals:**\r
\r
- Business rules exist\r
- Need for testability\r
- Some complexity in operations\r
\r
**Approach:**\r
\r
- ✅ Service layer with dependency injection\r
- ✅ Repository pattern (if multiple data sources or testability critical)\r
- ✅ Separate domain models from DTOs\r
- ⚠️ Consider: Interface segregation for services\r
- ❌ Don't add: Full DDD, CQRS (unless signals present)\r
\r
#### Level 3: Complex Domain (DDD Tactical Patterns)\r
\r
**Signals:**\r
\r
- Rich business domain with invariants\r
- Complex business rules\r
- Multiple aggregates interacting\r
- Business logic is core competitive advantage\r
\r
**Approach:**\r
\r
- ✅ Entities, Value Objects, Aggregates\r
- ✅ Repository pattern (only for aggregate roots)\r
- ✅ Domain events for aggregate communication\r
- ✅ Business rules encapsulated in domain objects\r
- ⚠️ Consider: Separate bounded contexts\r
\r
#### Level 4: High Scalability/Flexibility (Hexagonal/CQRS)\r
\r
**Signals:**\r
\r
- Multiple external integrations\r
- Read/write patterns differ significantly\r
- High testability requirements\r
- Technology changes likely\r
- Performance/scalability critical\r
\r
**Approach:**\r
\r
- ✅ Hexagonal architecture (ports & adapters)\r
- ✅ CQRS (if read/write separation justified)\r
- ✅ Event sourcing (if audit/time-travel needed)\r
- ✅ Separate read/write models\r
\r
**🎯 CRITICAL: Start at Level 1, evolve to higher levels ONLY when signals clearly appear**\r
\r
**Document your assessment:**\r
\r
```markdown\r
