## 🎯 CORE PRINCIPLES FOUNDATION\r
\r
**These principles apply to EVERY implementation. Non-negotiable.**\r
\r
### SOLID Principles\r
\r
#### S - Single Responsibility Principle\r
\r
_"A class/module should have one, and only one, reason to change."_\r
\r
**Ask yourself before implementing:**\r
\r
- Can I describe this class in one sentence without using "and"?\r
- If requirements change, how many reasons would this code need to change?\r
- Does this do more than one thing?\r
\r
```pseudocode\r
✅ CORRECT: UserRepository - Handles user data persistence\r
❌ WRONG: UserManager - Handles authentication AND profile updates AND email sending\r
```\r
\r
#### O - Open/Closed Principle\r
\r
_"Open for extension, closed for modification."_\r
\r
**When to apply:**\r
\r
- You have varying behaviors that follow a common contract\r
- Adding new types shouldn't require editing existing code\r
\r
**When NOT to apply:**\r
\r
- You have only one implementation (YAGNI violation)\r
\r
```pseudocode\r
// Apply when variations exist\r
interface PaymentProcessor { process(amount): Result }\r
class CreditCardProcessor implements PaymentProcessor\r
class PayPalProcessor implements PaymentProcessor\r
\r
// Don't create interface for single implementation\r
```\r
\r
#### L - Liskov Substitution Principle\r
\r
_"Subtypes must be substitutable for their base types."_\r
\r
**Red flags:**\r
\r
- Overriding methods to throw "Not Implemented"\r
- Child class can't do what parent promises\r
- Violating contracts in subclasses\r
\r
#### I - Interface Segregation Principle\r
\r
_"Many client-specific interfaces better than one general-purpose interface."_\r
\r
**When to apply:**\r
\r
- Interface has grown to serve multiple unrelated clients\r
- Clients depend on methods they don't use\r
\r
**When NOT to apply:**\r
\r
- You only have one implementation (YAGNI)\r
\r
```pseudocode\r
// ❌ Fat interface\r
interface UserService {\r
  authenticate(), updateProfile(), sendEmail(), exportCSV(), generateReport()\r
}\r
\r
// ✅ Segregated interfaces\r
interface Authenticator { authenticate() }\r
interface ProfileManager { updateProfile() }\r
interface UserNotifier { sendEmail() }\r
```\r
\r
#### D - Dependency Inversion Principle\r
\r
_"Depend on abstractions, not concretions."_\r
\r
**When to apply:**\r
\r
- Need testability and flexibility\r
- Multiple implementations exist or are likely\r
\r
**When NOT to apply:**\r
\r
- Simple utility with no variants (YAGNI)\r
\r
```pseudocode\r
// ✅ Inject dependencies through constructor\r
class OrderService {\r
  constructor(\r
    repository: OrderRepositoryInterface,\r
    notifier: NotifierInterface\r
  ) { }\r
}\r
```\r
\r
---\r
\r
### DRY - Don't Repeat Yourself\r
\r
**Critical rule:** Don't DRY prematurely!\r
\r
**Decision framework:**\r
\r
- First occurrence: Write it\r
- Second occurrence: Note the similarity\r
- Third occurrence: Extract abstraction (Rule of Three)\r
\r
**Important distinction:**\r
\r
- Same logic, same reason to change → Extract\r
- Similar code, different contexts → Keep separate (YAGNI)\r
\r
---\r
\r
### YAGNI - You Ain't Gonna Need It\r
\r
**Red flags indicating YAGNI violation:**\r
\r
- "We might need to support X in the future"\r
- "Let's make this generic in case..."\r
- "I'll add this interface even though there's only one implementation"\r
\r
**Apply YAGNI:**\r
\r
- Build for current requirements only\r
- Simple solution that works now\r
- Refactor when actual need arises\r
\r
---\r
\r
### KISS - Keep It Simple, Stupid\r
\r
**Complexity is justified when:**\r
\r
- It reduces overall system complexity\r
- It solves an actual, current problem\r
- It makes code more maintainable\r
\r
**Complexity is NOT justified when:**\r
\r
- It's just showing off pattern knowledge\r
- It's for hypothetical future requirements\r
- Simple solution works fine\r
\r
**Before adding complexity, ask:**\r
\r
- Can a new developer understand this in 5 minutes?\r
- Is there a simpler way to achieve the same result?\r
- Am I using patterns because they solve a problem or because they're clever?\r
\r
