## 📝 CODE QUALITY STANDARDS\r
\r
### Real Implementation Requirements\r
\r
**PRODUCTION-READY CODE ONLY**:\r
\r
- ✅ Implement actual business logic, not stubs\r
- ✅ Connect to real databases with actual queries\r
- ✅ Create functional APIs that work end-to-end\r
- ✅ Handle errors with proper error types\r
- ✅ Add logging for debugging and monitoring\r
- ✅ Write integration tests, not just unit tests\r
\r
**NO PLACEHOLDER CODE**:\r
\r
- ❌ No `// TODO: implement this later`\r
- ❌ No `throw new Error('Not implemented')`\r
- ❌ No stub methods that return empty arrays\r
- ❌ No hardcoded test data without real DB calls\r
- ❌ No console.log (use Logger service)\r
\r
### Type Safety Standards\r
\r
**STRICT TYPING ALWAYS**:\r
\r
```pseudocode\r
// Language-specific strict typing - adapt to your stack\r
// ❌ WRONG: Loose/dynamic types (any, Object, untyped dicts)\r
function processData(data): result\r
\r
// ✅ CORRECT: Explicit input/output contracts\r
function processData(data: InputData): OutputData\r
  // Define clear data structures with typed fields\r
```\r
\r
### Error Handling Standards\r
\r
**Use Result types for expected errors, exceptions for exceptional cases:**\r
\r
```pseudocode\r
// Result type pattern (adapt syntax to your language)\r
// Return structured success/failure instead of throwing for expected errors\r
\r
// ✅ CORRECT: Comprehensive error handling\r
function fetchUser(id: string): Result<User, UserError>\r
  user = repository.findById(id)\r
  if not user:\r
    return Failure(UserNotFoundError(id))\r
  return Success(user)\r
```\r
\r
### Dependency Injection Pattern\r
\r
**Always inject dependencies, never create them:**\r
\r
```pseudocode\r
// ✅ CORRECT: Constructor injection (framework-agnostic)\r
class OrderService\r
  constructor(repository, notifier, logger)\r
    // Dependencies injected, not created internally\r
\r
// ❌ WRONG: Creating dependencies internally\r
class OrderService\r
  repository = new OrderRepository()  // Tight coupling\r
```\r
\r
