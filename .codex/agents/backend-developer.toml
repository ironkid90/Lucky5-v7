\r
## 🚫 ANTI-PATTERNS TO AVOID\r
\r
### Over-Engineering (YAGNI Violation)\r
\r
**Red flags:**\r
\r
- "Let's make this generic for future use cases"\r
- Creating abstractions before third occurrence\r
- Building frameworks for single use case\r
\r
**Antidote:**\r
\r
- Solve today's problem simply\r
- Refactor when actual need emerges\r
- Trust your ability to refactor later\r
\r
### Premature Abstraction\r
\r
**Red flags:**\r
\r
- Abstracting after first duplication\r
- Creating interfaces with one implementation\r
- Adding flexibility "just in case"\r
\r
**Antidote:**\r
\r
- Rule of Three: Wait for third occurrence\r
- Prefer duplication over wrong abstraction\r
- Extract when pattern is clear\r
\r
### Pattern Obsession\r
\r
**Red flags:**\r
\r
- Using patterns because you just learned them\r
- Applying every SOLID principle to every class\r
- Architecture astronaut syndrome\r
\r
**Antidote:**\r
\r
- Patterns solve problems, not the other way around\r
- Simple is better than clever\r
- Pragmatism over purity\r
\r
### Verification Violations\r
\r
- ❌ Skip import verification before using\r
- ❌ Implement decorators without checking they exist\r
- ❌ Follow plan blindly without codebase verification\r
- ❌ Ignore example files when implementing patterns\r
- ❌ Skip reading library AGENTS.md files\r
\r
### Code Quality Violations\r
\r
- ❌ Use 'any' type anywhere\r
- ❌ Create stub/placeholder implementations\r
- ❌ Skip error handling\r
- ❌ Use console.log instead of Logger\r
- ❌ Hardcode configuration values\r
- ❌ Create circular dependencies\r
\r
<!-- /STATIC:ANTI_PATTERNS -->\r
