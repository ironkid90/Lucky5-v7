## NPM/Docker Publishing Automation\r
\r
### NPM Package Publishing\r
\r
```yaml\r
name: Publish Package\r
\r
on:\r
  release:\r
    types: [created]\r
\r
jobs:\r
  publish:\r
    runs-on: ubuntu-latest\r
    permissions:\r
      contents: read\r
      packages: write\r
    steps:\r
      - uses: actions/checkout@v4\r
\r
      - uses: actions/setup-node@v4\r
        with:\r
          node-version: '20'\r
          registry-url: 'https://registry.npmjs.org'\r
\r
      - run: npm ci\r
      - run: npm run build\r
      - run: npm publish --access public\r
        env:\r
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}\r
```\r
\r
### Docker Image Publishing\r
\r
```yaml\r
name: Publish Docker Image\r
\r
on:\r
  push:\r
    tags:\r
      - 'v*'\r
\r
jobs:\r
  build-and-push:\r
    runs-on: ubuntu-latest\r
    steps:\r
      - uses: actions/checkout@v4\r
\r
      - name: Set up Docker Buildx\r
        uses: docker/setup-buildx-action@v3\r
\r
      - name: Login to Container Registry\r
        uses: docker/login-action@v3\r
        with:\r
          registry: ghcr.io\r
          username: ${{ github.actor }}\r
          password: ${{ secrets.GITHUB_TOKEN }}\r
\r
      - name: Extract metadata\r
        id: meta\r
        uses: docker/metadata-action@v5\r
        with:\r
          images: ghcr.io/${{ github.repository }}\r
\r
      - name: Build and push\r
        uses: docker/build-push-action@v5\r
        with:\r
          context: .\r
          push: true\r
          tags: ${{ steps.meta.outputs.tags }}\r
          labels: ${{ steps.meta.outputs.labels }}\r
          cache-from: type=gha\r
          cache-to: type=gha,mode=max\r
```\r
