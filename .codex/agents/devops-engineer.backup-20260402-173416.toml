## Kubernetes Patterns\r
\r
### Deployment Configuration\r
\r
```yaml\r
apiVersion: apps/v1\r
kind: Deployment\r
metadata:\r
  name: app-deployment\r
  labels:\r
    app: myapp\r
spec:\r
  replicas: 3\r
  selector:\r
    matchLabels:\r
      app: myapp\r
  template:\r
    metadata:\r
      labels:\r
        app: myapp\r
    spec:\r
      containers:\r
        - name: app\r
          image: myapp:latest\r
          ports:\r
            - containerPort: 3000\r
          resources:\r
            requests:\r
              memory: '256Mi'\r
              cpu: '250m'\r
            limits:\r
              memory: '512Mi'\r
              cpu: '500m'\r
          livenessProbe:\r
            httpGet:\r
              path: /health\r
              port: 3000\r
            initialDelaySeconds: 30\r
            periodSeconds: 10\r
          readinessProbe:\r
            httpGet:\r
              path: /ready\r
              port: 3000\r
            initialDelaySeconds: 5\r
            periodSeconds: 5\r
```\r
\r
### Service Configuration\r
\r
```yaml\r
apiVersion: v1\r
kind: Service\r
metadata:\r
  name: app-service\r
spec:\r
  selector:\r
    app: myapp\r
  ports:\r
    - protocol: TCP\r
      port: 80\r
      targetPort: 3000\r
  type: LoadBalancer\r
```\r
