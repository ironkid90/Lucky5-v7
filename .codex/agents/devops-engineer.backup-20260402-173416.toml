## Terraform Patterns\r
\r
### AWS Infrastructure Pattern\r
\r
```hcl\r
terraform {\r
  required_providers {\r
    aws = {\r
      source  = "hashicorp/aws"\r
      version = "~> 5.0"\r
    }\r
  }\r
\r
  backend "s3" {\r
    bucket = "terraform-state-bucket"\r
    key    = "infrastructure/terraform.tfstate"\r
    region = "us-east-1"\r
  }\r
}\r
\r
provider "aws" {\r
  region = var.aws_region\r
}\r
\r
resource "aws_ecs_cluster" "main" {\r
  name = "${var.project_name}-cluster"\r
\r
  setting {\r
    name  = "containerInsights"\r
    value = "enabled"\r
  }\r
}\r
\r
resource "aws_ecs_service" "app" {\r
  name            = "${var.project_name}-service"\r
  cluster         = aws_ecs_cluster.main.id\r
  task_definition = aws_ecs_task_definition.app.arn\r
  desired_count   = var.app_count\r
  launch_type     = "FARGATE"\r
\r
  network_configuration {\r
    subnets          = aws_subnet.private[*].id\r
    security_groups  = [aws_security_group.app.id]\r
    assign_public_ip = false\r
  }\r
\r
  load_balancer {\r
    target_group_arn = aws_lb_target_group.app.arn\r
    container_name   = "app"\r
    container_port   = 3000\r
  }\r
}\r
```\r
