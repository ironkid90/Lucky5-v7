## CI/CD Implementation Patterns\r
\r
### GitHub Actions Workflow Pattern\r
\r
```yaml\r
name: CI/CD Pipeline\r
\r
on:\r
  push:\r
    branches: [main, develop]\r
  pull_request:\r
    branches: [main]\r
\r
jobs:\r
  build:\r
    runs-on: ubuntu-latest\r
    steps:\r
      - uses: actions/checkout@v4\r
\r
      - name: Setup Node.js\r
        uses: actions/setup-node@v4\r
        with:\r
          node-version: '20'\r
          cache: 'npm'\r
\r
      - name: Install Dependencies\r
        run: npm ci\r
\r
      - name: Lint & Type Check\r
        run: |\r
          npm run lint\r
          npm run typecheck\r
\r
      - name: Build\r
        run: npm run build\r
\r
      - name: Test\r
        run: npm run test -- --coverage\r
\r
      - name: Upload Coverage\r
        uses: codecov/codecov-action@v4\r
        with:\r
          file: ./coverage/lcov.info\r
\r
  deploy:\r
    needs: build\r
    if: github.ref == 'refs/heads/main'\r
    runs-on: ubuntu-latest\r
    steps:\r
      - name: Deploy to Production\r
        run: |\r
          # Deployment steps\r
```\r
\r
### Docker Configuration Pattern\r
\r
```dockerfile\r
# Multi-stage build for optimized images\r
FROM node:20-alpine AS builder\r
\r
WORKDIR /app\r
COPY package*.json ./\r
RUN npm ci --only=production\r
\r
COPY . .\r
RUN npm run build\r
\r
FROM node:20-alpine AS runtime\r
\r
WORKDIR /app\r
COPY --from=builder /app/dist ./dist\r
COPY --from=builder /app/node_modules ./node_modules\r
COPY package.json ./\r
\r
USER node\r
EXPOSE 3000\r
CMD ["node", "dist/main.js"]\r
```\r
\r
### Docker Compose Pattern\r
\r
```yaml\r
version: '3.8'\r
\r
services:\r
  app:\r
    build:\r
      context: .\r
      dockerfile: Dockerfile\r
    ports:\r
      - '3000:3000'\r
    environment:\r
      - NODE_ENV=production\r
      - DATABASE_URL=${DATABASE_URL}\r
    depends_on:\r
      - db\r
    healthcheck:\r
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']\r
      interval: 30s\r
      timeout: 10s\r
      retries: 3\r
\r
  db:\r
    image: postgres:16-alpine\r
    volumes:\r
      - postgres_data:/var/lib/postgresql/data\r
    environment:\r
      - POSTGRES_DB=${DB_NAME}\r
      - POSTGRES_USER=${DB_USER}\r
      - POSTGRES_PASSWORD=${DB_PASSWORD}\r
\r
volumes:\r
  postgres_data:\r
```\r
