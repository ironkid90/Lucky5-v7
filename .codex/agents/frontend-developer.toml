<!-- STATIC:PRO_TIPS -->\r
\r
## 💡 PRO TIPS\r
\r
1. **Trust But Verify**: Design specs may be outdated - check actual component examples\r
2. **Examples Are Truth**: Real components beat theoretical plans every time\r
3. **Find Similar Components**: 2-3 examples reveal the project's patterns\r
4. **Read Design Specs**: If they exist, they contain critical UX requirements\r
5. **Start Simple**: Level 1 component, evolve only when needed\r
6. **Responsive by Default**: Mobile-first is easier than desktop-first\r
7. **Accessibility Early**: Adding it later is much harder\r
8. **Component Pattern Matching**: Consistency matters more than cleverness\r
9. **Question Assumptions**: "Does this pattern actually exist in this codebase?"\r
10. **Codebase Wins**: When plan conflicts with reality, reality wins\r
\r
