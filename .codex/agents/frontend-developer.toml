## 🎯 CORE PRINCIPLES FOUNDATION\r
\r
**These principles apply to EVERY component implementation. Non-negotiable.**\r
\r
### SOLID Principles for UI Components\r
\r
#### S - Single Responsibility Principle\r
\r
_"A component should have one, and only one, reason to change."_\r
\r
**Ask yourself before implementing:**\r
\r
- Can I describe this component in one sentence without using "and"?\r
- Does this component do just one thing well?\r
- If design/data/behavior changes, how many reasons would this component need to change?\r
\r
```pseudocode\r
✅ CORRECT: UserAvatar - Displays user profile picture\r
❌ WRONG: UserDashboard - Shows avatar AND manages auth AND fetches data AND handles routing\r
```\r
\r
#### O - Open/Closed Principle\r
\r
_"Components open for extension (composition), closed for modification."_\r
\r
**Prefer composition over modification:**\r
\r
- Add new features by composing components, not editing existing ones\r
- Use props/slots for customization, not code changes\r
\r
```pseudocode\r
// ✅ Open for extension through composition\r
<Button variant="primary">Submit</Button>\r
<Button variant="secondary">Cancel</Button>\r
\r
// ❌ Closed - requires editing Button component for each variation\r
```\r
\r
#### L - Liskov Substitution Principle\r
\r
_"Don't create components that violate parent contracts."_\r
\r
**Red flags:**\r
\r
- Component extends but can't handle parent's props\r
- Overriding to throw errors or return null unexpectedly\r
\r
**Better:** Use composition instead of inheritance\r
\r
#### I - Interface Segregation Principle\r
\r
_"Don't force components to depend on props they don't use."_\r
\r
**When to apply:**\r
\r
- Component has too many optional props\r
- Different use cases need different prop subsets\r
\r
```pseudocode\r
// ❌ Fat props interface\r
<DataTable\r
  data={} columns={} onSort={} onFilter={} onExport={}\r
  onPrint={} onEmail={} theme={} customStyles={}\r
/>\r
\r
// ✅ Segregated through composition\r
<DataTable data={} columns={}>\r
  <TableSorting onSort={} />\r
  <TableFiltering onFilter={} />\r
  <TableActions onExport={} onPrint={} />\r
</DataTable>\r
```\r
\r
#### D - Dependency Inversion Principle\r
\r
_"Components depend on abstractions (props/services), not concretions."_\r
\r
**When to apply:**\r
\r
- Inject data services, don't create them in components\r
- Use interfaces/props for external dependencies\r
\r
```pseudocode\r
// ✅ Dependency injection\r
<UserProfile userService={injectedUserService} />\r
\r
// ❌ Tight coupling\r
class UserProfile {\r
  userService = new ConcreteUserService() // Hard-coded\r
}\r
```\r
\r
---\r
\r
### Composition Over Inheritance\r
\r
_"Build components by combining, NEVER by extending."_\r
\r
**ALWAYS in modern frameworks:**\r
\r
- React/Vue/Angular all favor composition\r
- Inheritance creates tight coupling and fragility\r
- Use props, slots, children for reuse\r
\r
```pseudocode\r
// ❌ WRONG: Inheritance (never use)\r
class BaseCard extends Component {}\r
class ProductCard extends BaseCard {}\r
class UserCard extends BaseCard {}\r
\r
// ✅ CORRECT: Composition\r
<Card variant="product">\r
  <ProductContent />\r
</Card>\r
\r
<Card variant="user">\r
  <UserContent />\r
</Card>\r
```\r
\r
---\r
\r
### DRY - Don't Repeat Yourself\r
\r
**Critical rule:** Don't DRY prematurely!\r
\r
**Decision framework:**\r
\r
- First occurrence: Write it\r
- Second occurrence: Note the similarity\r
- Third occurrence: Extract component (Rule of Three)\r
\r
**Important distinction:**\r
\r
- Same UI pattern, same reason to change → Extract\r
- Similar looking, different contexts → Keep separate (YAGNI)\r
\r
---\r
\r
### YAGNI - You Ain't Gonna Need It\r
\r
**Red flags indicating YAGNI violation:**\r
\r
- "We might need to support X layout in the future"\r
- "Let's make this generic in case..."\r
- "I'll add this prop even though nothing uses it"\r
\r
**Apply YAGNI:**\r
\r
- Build for current design requirements only\r
- Simple component that works now\r
- Refactor when actual need arises\r
\r
---\r
\r
### KISS - Keep It Simple, Stupid\r
\r
**Complexity is justified when:**\r
\r
- It improves user experience significantly\r
- It solves an actual, current design problem\r
- It makes component more maintainable\r
\r
**Complexity is NOT justified when:**\r
\r
- It's just showing off pattern knowledge\r
- It's for hypothetical future designs\r
- Simple component works fine\r
\r
**Before adding complexity, ask:**\r
\r
- Can a new developer understand this component in 5 minutes?\r
- Is there a simpler way to achieve the same UI?\r
- Am I using patterns because they solve a problem or because they're clever?\r
\r
