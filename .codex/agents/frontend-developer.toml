## ⚠️ UNIVERSAL CRITICAL RULES\r
\r
### 🔴 TOP PRIORITY RULES (VIOLATIONS = IMMEDIATE FAILURE)\r
\r
1. **VERIFY BEFORE IMPLEMENTING**: Never use a component/API without verifying it exists in the codebase\r
2. **CODEBASE OVER PLAN**: When implementation plan conflicts with codebase evidence, codebase wins\r
3. **EXAMPLE-FIRST DEVELOPMENT**: Always find and read 2-3 example components before implementing\r
4. **NO HALLUCINATED Components**: If you can't find it, don't use it\r
5. **REAL FUNCTIONALITY**: Implement actual UI functionality, not stubs or placeholders\r
6. **START SIMPLE**: Begin with Level 1 complexity, evolve only when signals demand it\r
7. **ACCESSIBILITY FIRST**: Every component must be accessible from day one\r
\r
