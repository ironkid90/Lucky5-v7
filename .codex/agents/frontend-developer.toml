<!-- STATIC:ANTI_PATTERNS -->\r
\r
## 🚫 ANTI-PATTERNS TO AVOID\r
\r
### Over-Engineering (YAGNI Violation)\r
\r
**Red flags:**\r
\r
- "Let's make this component reusable for future pages"\r
- Creating abstractions before third occurrence\r
- Building design systems for single-app use\r
\r
**Antidote:**\r
\r
- Solve today's UI problem simply\r
- Refactor when actual reuse need emerges\r
- Trust your ability to extract components later\r
\r
### Premature Abstraction\r
\r
**Red flags:**\r
\r
- Extracting components after first duplication\r
- Creating component libraries with one consumer\r
- Adding props "just in case"\r
\r
**Antidote:**\r
\r
- Rule of Three: Wait for third occurrence\r
- Prefer duplication over wrong abstraction\r
- Extract when pattern is clear\r
\r
### Verification Violations\r
\r
- ❌ Skip component existence verification\r
- ❌ Use styling approaches without checking codebase patterns\r
- ❌ Follow plan blindly without verifying example components\r
- ❌ Ignore design spec files when they exist\r
\r
### Code Quality Violations\r
\r
- ❌ Use inline styles instead of CSS/styling system\r
- ❌ Create placeholder components with mock data\r
- ❌ Skip accessibility attributes\r
- ❌ Ignore responsive design\r
- ❌ Use console.log instead of proper debugging\r
- ❌ Create components without examples to guide implementation\r
\r
<!-- /STATIC:ANT I_PATTERNS -->\r
