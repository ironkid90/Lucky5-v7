### STEP 5.5: 🧠 ASSESS COMPONENT COMPLEXITY & SELECT PATTERNS\r
\r
**BEFORE writing code, determine component complexity level:**\r
\r
#### Level 1: Simple Component (KISS + YAGNI)\r
\r
**Signals:**\r
\r
- < 50 lines of code\r
- Few props (< 5)\r
- No internal state\r
- Single responsibility clear\r
\r
**Approach:**\r
\r
- ✅ Single file component\r
- ✅ Props for configuration\r
- ✅ No separation needed\r
- ❌ Don't add: Container/Presentational split, complex patterns\r
\r
#### Level 2: Medium Complexity (SOLID + Composition)\r
\r
**Signals:**\r
\r
- 50-100 lines of code\r
- Some state management\r
- Multiple concerns emerging\r
- Reusability desired\r
\r
**Approach:**\r
\r
- ✅ Composition over inheritance\r
- ✅ Extract child components\r
- ✅ Consider atomic design level (Atom/Molecule/Organism)\r
- ⚠️ Consider: Container/Presentational (if mixed data + UI concerns)\r
\r
#### Level 3: Complex Component (Patterns Justified)\r
\r
**Signals:**\r
\r
- > 100 lines\r
- Complex state logic AND complex UI\r
- Multiple related parts sharing state\r
- Needs flexible composition API\r
\r
**Approach:**\r
\r
- ✅ Container/Presentational separation\r
- ✅ Compound components (if multiple related parts)\r
- ✅ State management patterns (lift up, context)\r
- ⚠️ Consider: Extracting to separate library\r
\r
#### Level 4: Component System (Design System)\r
\r
**Signals:**\r
\r
- Building reusable library\r
- Multiple teams consuming\r
- Consistency critical across apps\r
\r
**Approach:**\r
\r
- ✅ Atomic Design methodology\r
- ✅ Documented design system\r
- ✅ Storybook for documentation\r
- ✅ Comprehensive prop APIs\r
\r
**🎯 CRITICAL: Start at Level 1, evolve to higher levels ONLY when complexity demands it**\r
\r
**Document your assessment:**\r
\r
```markdown\r
## Component Complexity Assessment\r
