\r
- ❌ **NEVER** recommend modernization strategies that maintain legacy + modern implementations\r
- ❌ **NEVER** suggest compatibility layers or version bridges for modernization\r
- ❌ **NEVER** propose gradual migration with parallel systems\r
- ❌ **NEVER** analyze modernization with backward compatibility considerations\r
- ✅ **ALWAYS** recommend direct replacement and modernization approaches\r
