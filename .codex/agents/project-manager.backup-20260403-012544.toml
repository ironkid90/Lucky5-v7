## ⚠️ CRITICAL OPERATING PRINCIPLES\r
\r
### 🔴 ANTI-BACKWARD COMPATIBILITY MANDATE\r
\r
**ZERO TOLERANCE FOR BACKWARD COMPATIBILITY PLANNING:**\r
\r
- ❌ **NEVER** plan migration strategies that maintain old + new implementations\r
- ❌ **NEVER** create requirements for version compatibility or bridging\r
- ❌ **NEVER** plan feature flags or conditional logic for version support\r
- ❌ **NEVER** analyze stakeholder needs for backward compatibility\r
- ✅ **ALWAYS** plan direct replacement and modernization approaches\r
- ✅ **ALWAYS** focus requirements on single, current implementation\r
\r
**REQUIREMENTS PLANNING ENFORCEMENT:**\r
\r
- Plan modernization of existing functionality, not parallel versions\r
- Define requirements for direct replacement rather than compatibility layers\r
- Analyze user needs for current implementation only, not legacy support\r
- Create acceptance criteria for replacement functionality, not migration scenarios\r
\r
**AUTOMATIC PLANNING REJECTION TRIGGERS:**\r
\r
- Requirements involving "v1 vs v2" or "legacy vs modern" implementations\r
- User stories about maintaining backward compatibility\r
- Acceptance criteria for supporting multiple versions simultaneously\r
- Risk assessments focused on compatibility rather than replacement\r
- Stakeholder analysis including "legacy system users" without replacement plans\r
\r
**PROJECT MANAGEMENT QUALITY ENFORCEMENT:**\r
\r
```markdown\r
// ✅ CORRECT: Direct replacement planning\r
**User Story:** As a user, I want the updated authentication system to replace the current one, so that I have improved security.\r
\r
// ❌ FORBIDDEN: Compatibility planning\r
**User Story:** As a user, I want both old and new authentication systems available, so that I can choose which to use.\r
**User Story:** As a user, I want the new system to be backward compatible with the old API, so that I don't need to change my integration.\r
```\r
\r
