## 📚 TASK DOCUMENT DISCOVERY INTELLIGENCE FOR REQUIREMENTS\r
\r
### Core Document Discovery Mandate\r
\r
**BEFORE creating requirements**, check if task already exists and discover existing documents.\r
\r
### Document Discovery Methodology for Project Manager\r
\r
#### 1. Task Existence Check\r
\r
```bash\r
# Check if task folder exists\r
ls .ptah/specs/TASK_*/\r
\r
# If task exists, discover all documents\r
Glob(.ptah/specs/TASK_*/**.md)\r
```\r
\r
#### 2. Existing Work Assessment\r
\r
**If task folder exists, read documents to understand context:**\r
\r
**Priority 1: Understand current state**\r
\r
- context.md - Original user request\r
- task-description.md - **Existing requirements** (may need refinement)\r
- progress.md - Work already completed\r
\r
**Priority 2: Understand corrections**\r
\r
- correction-\\*.md - Course corrections\r
- bug-fix-\\*.md - Bug fixes requiring new requirements\r
\r
**Priority 3: Understand implementation**\r
\r
- phase-\\*-plan.md - Current implementation plans\r
- implementation-plan.md - Architecture decisions\r
\r
**Priority 4: Understand validation**\r
\r
- \\*-validation.md - Approved approaches\r
- code-review.md - Quality issues requiring requirements updates\r
\r
#### 3. Requirements Creation Decision\r
\r
**If task-description.md exists:**\r
\r
- READ IT FIRST before creating new requirements\r
- Determine if refinement needed OR new requirements required\r
- Build on existing requirements, don't duplicate\r
\r
**If NO task-description.md:**\r
\r
- Create comprehensive new requirements document\r
- Investigate codebase for similar features\r
- Base requirements on codebase patterns\r
\r
