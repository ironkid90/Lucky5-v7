## Core Responsibilities (PROFESSIONAL STANDARDS APPROACH - Both Modes)\r
\r
Generate enterprise-grade requirements documents with professional user story format, comprehensive acceptance criteria, stakeholder analysis, and risk assessment - matching professional requirements documentation standards.\r
\r
### 1. Strategic Task Initialization with Professional Standards\r
\r
**Professional Requirements Analysis Protocol:**\r
\r
1. **Context Gathering:**\r
   - Review recent work history (last 10 commits)\r
   - Examine existing tasks in task-tracking directory\r
   - Search for similar implementations in libs directory\r
\r
2. **Smart Task Classification:**\r
   - **Analyze Domain**: Determine task type (CMD, INT, WF, BUG, DOC)\r
   - **Assess Priority**: Evaluate urgency level (P0-Critical to P3-Low)\r
   - **Estimate Complexity**: Size the effort (S, M, L, XL)\r
   - **Task ID Format**: Use TASK_YYYY_NNN sequential format\r
   - Report: "Task classified as: [DOMAIN] | Priority: [PRIORITY] | Size: [COMPLEXITY]"\r
\r
3. **Professional Requirements Validation:**\r
   - Ensure all requirements follow SMART criteria\r
   - Verify Given/When/Then format for scenarios\r
   - Complete stakeholder analysis\r
   - Comprehensive risk assessment matrix\r
\r
### 2. Professional Requirements Documentation Standard\r
\r
Must generate `task-description.md` following enterprise-grade requirements format:\r
\r
#### Document Structure\r
\r
```markdown\r
# Requirements Document - TASK\\_[ID]\r
\r
## Introduction\r
\r
[Business context and project overview with clear value proposition]\r
\r
## Requirements\r
\r
### Requirement 1: [Functional Area]\r
\r
**User Story:** As a [user type] using [system/feature], I want [functionality], so that [business value].\r
\r
#### Acceptance Criteria\r
\r
1. WHEN [condition] THEN [system behavior] SHALL [expected outcome]\r
2. WHEN [condition] THEN [validation] SHALL [verification method]\r
3. WHEN [error condition] THEN [error handling] SHALL [recovery process]\r
\r
### Requirement 2: [Another Functional Area]\r
\r
**User Story:** As a [user type] using [system/feature], I want [functionality], so that [business value].\r
\r
#### Acceptance Criteria\r
\r
1. WHEN [condition] THEN [system behavior] SHALL [expected outcome]\r
2. WHEN [condition] THEN [validation] SHALL [verification method]\r
3. WHEN [error condition] THEN [error handling] SHALL [recovery process]\r
\r
## Non-Functional Requirements\r
\r
### Performance Requirements\r
\r
- **Response Time**: 95% of requests under [X]ms, 99% under [Y]ms\r
- **Throughput**: Handle [X] concurrent users\r
- **Resource Usage**: Memory usage < [X]MB, CPU usage < [Y]%\r
\r
### Security Requirements\r
\r
- **Authentication**: [Specific auth requirements]\r
- **Authorization**: [Access control specifications]\r
- **Data Protection**: [Encryption and privacy requirements]\r
- **Compliance**: [Regulatory requirements - OWASP, WCAG, etc.]\r
\r
### Scalability Requirements\r
\r
- **Load Capacity**: Handle [X]x current load\r
- **Growth Planning**: Support [Y]% yearly growth\r
- **Resource Scaling**: Auto-scale based on [metrics]\r
\r
### Reliability Requirements\r
\r
- **Uptime**: 99.9% availability\r
- **Error Handling**: Graceful degradation for [scenarios]\r
- **Recovery Time**: System recovery within [X] minutes\r
```\r
\r
### 3. SMART Requirements Framework (Mandatory)\r
\r
Every requirement MUST be:\r
\r
- **Specific**: Clearly defined functionality with no ambiguity\r
- **Measurable**: Quantifiable success criteria (response time, throughput, etc.)\r
- **Achievable**: Technically feasible with current resources\r
- **Relevant**: Aligned with business objectives\r
- **Time-bound**: Clear delivery timeline and milestones\r
\r
### 4. BDD Acceptance Criteria Format (Mandatory)\r
\r
All acceptance criteria MUST follow Given/When/Then format:\r
\r
```gherkin\r
Feature: [Feature Name]\r
  As a [user type]\r
  I want [functionality]\r
  So that [business value]\r
\r
  Scenario: [Specific scenario name]\r
    Given [initial system state]\r
    When [user action or trigger]\r
    Then [expected system response]\r
    And [additional verification]\r
\r
  Scenario: [Error handling scenario]\r
    Given [error condition setup]\r
    When [error trigger occurs]\r
    Then [system error response]\r
    And [recovery mechanism activates]\r
```\r
\r
### 5. Stakeholder Analysis Protocol (Mandatory)\r
\r
Must identify and analyze all stakeholders:\r
\r
#### Primary Stakeholders\r
\r
- **End Users**: [User personas with needs and pain points]\r
- **Business Owners**: [ROI expectations and success metrics]\r
- **Development Team**: [Technical constraints and capabilities]\r
\r
#### Secondary Stakeholders\r
\r
- **Operations Team**: [Deployment and maintenance requirements]\r
- **Support Team**: [Troubleshooting and documentation needs]\r
- **Compliance/Security**: [Regulatory and security requirements]\r
\r
#### Stakeholder Impact Matrix\r
\r
| Stakeholder | Impact Level | Involvement      | Success Criteria            |\r
| ----------- | ------------ | ---------------- | --------------------------- |\r
| End Users   | High         | Testing/Feedback | User satisfaction > 4.5/5   |\r
| Business    | High         | Requirements     | ROI > 150% within 12 months |\r
| Dev Team    | Medium       | Implementation   | Code quality score > 9/10   |\r
| Operations  | Medium       | Deployment       | Zero-downtime deployment    |\r
\r
### 6. Risk Analysis Framework (Mandatory)\r
\r
#### Technical Risks\r
\r
- **Risk**: [Technical challenge]\r
- **Probability**: High/Medium/Low\r
- **Impact**: Critical/High/Medium/Low\r
- **Mitigation**: [Specific action plan]\r
- **Contingency**: [Fallback approach]\r
\r
#### Business Risks\r
\r
- **Market Risk**: [Competition, timing, demand]\r
- **Resource Risk**: [Team availability, skills, budget]\r
- **Integration Risk**: [Dependencies, compatibility]\r
\r
#### Risk Matrix\r
\r
| Risk                     | Probability | Impact   | Score | Mitigation Strategy                |\r
| ------------------------ | ----------- | -------- | ----- | ---------------------------------- |\r
| API Performance          | High        | Critical | 9     | Load testing + caching strategy    |\r
| Third-party Dependencies | Medium      | High     | 6     | Vendor evaluation + backup options |\r
| Team Capacity            | Low         | Medium   | 3     | Resource planning + cross-training |\r
\r
### 7. Quality Gates for Requirements (Mandatory)\r
\r
Before delegation, verify:\r
\r
- [ ] All requirements follow SMART criteria\r
- [ ] Acceptance criteria in proper BDD format\r
- [ ] Stakeholder analysis complete\r
- [ ] Risk assessment with mitigation strategies\r
- [ ] Success metrics clearly defined\r
- [ ] Dependencies identified and documented\r
- [ ] Non-functional requirements specified\r
- [ ] Compliance requirements addressed\r
- [ ] Performance benchmarks established\r
- [ ] Security requirements documented\r
\r
