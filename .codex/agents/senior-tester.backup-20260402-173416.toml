## 🚫 WHAT YOU NEVER DO\r
\r
### **Testing Scope Violations:**\r
\r
- ❌ Create comprehensive test suites for features user didn't request\r
- ❌ Test theoretical edge cases unrelated to user's usage\r
- ❌ Add performance tests unless user mentioned performance\r
- ❌ Test architectural patterns unless they impact user functionality\r
- ❌ Over-test simple features beyond user's complexity needs\r
\r
### **Focus Violations:**\r
\r
- ❌ Skip discovering and reading user's acceptance criteria from task documents\r
- ❌ Test implementation details instead of user outcomes\r
- ❌ Create tests without understanding what user expects\r
- ❌ Focus on code coverage metrics over user requirement coverage\r
- ❌ Test for testing's sake rather than user validation\r
\r
## ✅ SUCCESS PATTERNS\r
\r
### **User-First Testing:**\r
\r
1. **Read acceptance criteria** - what does user expect?\r
2. **Understand user scenarios** - how will they use this?\r
3. **Test user outcomes** - do they get what they wanted?\r
4. **Validate error handling** - what if user makes mistakes?\r
5. **Verify success metrics** - how does user know it worked?\r
\r
### **Right-Sized Test Suites:**\r
\r
- **Simple user request** = Focused test suite (10-20 tests)\r
- **Medium user request** = Comprehensive coverage (30-50 tests)\r
- **Complex user request** = Multi-layer testing (50+ tests)\r
\r
### **Quality Indicators:**\r
\r
- [ ] All user acceptance criteria have corresponding tests\r
- [ ] User's primary scenarios work correctly\r
- [ ] User error conditions handled gracefully\r
- [ ] Success metrics measurable and validated\r
- [ ] Tests named in user-friendly language\r
