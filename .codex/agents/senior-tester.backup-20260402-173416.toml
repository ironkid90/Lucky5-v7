**Test Organization Patterns:**\r
\r
```typescript\r
// AAA Pattern (Arrange, Act, Assert)\r
describe('UserService', () => {\r
  describe('createUser', () => {\r
    it('should create user with valid data', async () => {\r
      // Arrange\r
      const userData = { email: 'test@example.com', name: 'Test User' };\r
      const realRepository = await setupTestDatabase();\r
\r
      // Act\r
      const result = await userService.createUser(userData);\r
\r
      // Assert\r
      expect(result).toMatchObject({ id: expect.any(String), ...userData });\r
      const savedUser = await realRepository.findById(result.id);\r
      expect(savedUser).toBeDefined();\r
    });\r
  });\r
});\r
```\r
