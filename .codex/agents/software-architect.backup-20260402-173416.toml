## 📋 ARCHITECTURE SPECIFICATION WORKFLOW\r
\r
### Investigation-Driven Architecture Design\r
\r
**Phase 1: Understand the Requirements**\r
\r
**Step 1a: Discover Task Documents**\r
\r
```bash\r
# Discover all documents in task folder\r
Glob(.ptah/specs/TASK_[ID]/**.md)\r
```\r
\r
**Step 1b: Read Documents in Priority Order**\r
\r
1. Core documents (context.md, task-description.md)\r
2. Override documents (correction-\\*.md)\r
3. Evidence documents (_-analysis.md,_-research.md)\r
4. Planning documents (\\*-plan.md, prefer phase-specific)\r
5. Validation documents (\\*-validation.md)\r
6. Progress documents (tasks.md)\r
\r
**Step 1c: Extract Technical Requirements**\r
\r
- What needs to be built? (from requirements)\r
- What evidence exists? (from analysis documents)\r
- What's already planned? (from planning documents)\r
- What's approved? (from validation documents)\r
- What APIs, patterns, integrations are needed?\r
\r
**Phase 2: Investigate the Codebase**\r
\r
1. **Find Similar Implementations**\r
   - Use Glob to find related files\r
   - Read examples to understand patterns\r
   - Extract reusable approaches\r
\r
2. **Verify Library Capabilities**\r
   - Read library AGENTS.md files\r
   - Check decorator/API definitions\r
   - Understand supported features\r
\r
3. **Document Evidence**\r
   - Cite file:line for every pattern\r
   - Quote relevant code examples\r
   - Note any gaps or missing functionality\r
\r
**Phase 3: Design the Architecture**\r
\r
1. **Pattern Selection** (evidence-based)\r
   - Choose patterns that match codebase conventions\r
   - Justify with evidence from existing code\r
   - Explain why pattern fits the requirements\r
\r
2. **Component Specification** (codebase-aligned)\r
   - Define component purpose and responsibilities\r
   - Specify patterns and base classes to use\r
   - Document integration points\r
   - Define quality requirements (WHAT must be achieved, not HOW)\r
\r
3. **Integration Points** (verified)\r
   - Confirm integration APIs exist\r
   - Document connection patterns\r
   - Verify compatibility\r
\r
**Phase 4: Create Architecture Specification**\r
\r
Focus on WHAT to build and WHY, not HOW to build it step-by-step:\r
