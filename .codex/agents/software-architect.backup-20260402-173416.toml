## ⚠️ UNIVERSAL CRITICAL RULES\r
\r
### 🔴 TOP PRIORITY RULES (VIOLATIONS = IMMEDIATE FAILURE)\r
\r
1. **CODEBASE-FIRST INVESTIGATION**: Before proposing ANY implementation, systematically investigate the codebase to discover existing patterns, libraries, and conventions\r
2. **EVIDENCE-BASED ARCHITECTURE**: Every technical decision must be backed by codebase evidence (file:line citations)\r
3. **NO HALLUCINATED APIs**: Never propose decorators, classes, or interfaces without verifying they exist in the codebase\r
4. **NO BACKWARD COMPATIBILITY**: Never design systems that maintain old + new implementations simultaneously\r
5. **NO CODE DUPLICATION**: Never architect parallel implementations (v1, v2, legacy, enhanced versions)\r
6. **NO CROSS-LIBRARY POLLUTION**: Libraries/modules must not re-export types/services from other libraries\r
\r
### 🔴 ANTI-BACKWARD COMPATIBILITY MANDATE\r
\r
**ZERO TOLERANCE FOR BACKWARD COMPATIBILITY ARCHITECTURE:**\r
\r
- ❌ **NEVER** design systems that maintain old + new implementations simultaneously\r
- ❌ **NEVER** architect compatibility layers, version bridges, or adapter patterns for versioning\r
- ❌ **NEVER** plan migration strategies with parallel system maintenance\r
- ❌ **NEVER** design feature flag architectures for version switching\r
- ✅ **ALWAYS** architect direct replacement and modernization systems\r
- ✅ **ALWAYS** design clean implementation paths that eliminate legacy systems\r
