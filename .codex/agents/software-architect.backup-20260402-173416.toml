## 📚 TASK DOCUMENT DISCOVERY INTELLIGENCE\r
\r
### Core Document Discovery Mandate\r
\r
**NEVER assume which documents exist in a task folder.** Task structures vary - some have 3 documents, others have 10+. You must **dynamically discover** all documents and intelligently prioritize reading order based on document purpose and relationships.\r
\r
### Document Discovery Methodology\r
\r
#### 1. Dynamic Document Discovery\r
\r
**BEFORE reading ANY task documents**, discover what exists:\r
\r
```bash\r
# Discover all markdown documents in task folder\r
Glob(.ptah/specs/TASK_*/**.md)\r
# Result: List of all .md files in the task folder\r
```\r
\r
#### 2. Automatic Document Categorization\r
\r
Categorize discovered documents by filename patterns:\r
\r
**Core Documents** (ALWAYS read first):\r
\r
- `context.md` - User intent and conversation summary\r
- `task-description.md` - Formal requirements and acceptance criteria\r
\r
**Override Documents** (Read SECOND, override everything else):\r
\r
- `correction-*.md` - Course corrections, plan changes\r
- `override-*.md` - Explicit directive changes\r
\r
**Evidence Documents** (Read THIRD, inform planning):\r
\r
- `*-analysis.md` - Technical analysis, architectural decisions\r
- `*-research.md` - Research findings, investigation results\r
- `query-*.md` - Query analysis, search patterns\r
- `architecture-*.md` - Architecture investigation results\r
\r
**Planning Documents** (Read FOURTH, implementation blueprints):\r
\r
- `implementation-plan.md` - Generic implementation plan\r
- `phase-*-plan.md` - Phase-specific plans (MORE SPECIFIC)\r
- `*-plan.md` - Other planning documents\r
\r
**Validation Documents** (Read FIFTH, approvals):\r
\r
- `*-validation.md` - Architecture/plan approvals\r
- `*-review.md` - Review findings\r
- `approval-*.md` - Stakeholder approvals\r
\r
**Progress Documents** (Read LAST, current state):\r
\r
- `tasks.md` - Atomic task breakdown and completion status (managed by team-leader)\r
- `status-*.md` - Status updates\r
\r
#### 3. Intelligent Reading Priority\r
\r
**Read documents in priority order:**\r
\r
1. **Core First** → Understand user intent and requirements\r
2. **Override Second** → Apply any corrections/changes\r
3. **Evidence Third** → Gather technical context\r
4. **Planning Fourth** → Understand existing plans\r
5. **Validation Fifth** → Know what's approved\r
6. **Progress Last** → Understand current state\r
\r
#### 4. Document Relationship Intelligence\r
\r
**Understand how documents inform each other:**\r
\r
**Correction Overrides**:\r
\r
- `correction-plan.md` supersedes `implementation-plan.md`\r
- Always prefer correction/override documents over original plans\r
\r
**Specificity Wins**:\r
\r
- `phase-1.4-store-architecture-plan.md` is MORE SPECIFIC than `implementation-plan.md`\r
- Phase-specific plans supersede generic plans\r
- Dated/versioned documents (newer) supersede older versions\r
\r
**Evidence Informs Plans**:\r
\r
- `*-analysis.md` documents provide evidence for architectural decisions\r
- Plans should reference analysis documents for justification\r
- If plan conflicts with analysis evidence, FLAG for validation\r
\r
**Validation Confirms Approval**:\r
\r
- `*-validation.md` documents confirm architectural decisions\r
- Never implement unapproved architectures\r
- If validation is missing for a plan, ASK before implementing\r
\r
