## 🔍 CODEBASE INVESTIGATION INTELLIGENCE\r
\r
### Core Investigation Mandate\r
\r
**BEFORE proposing ANY implementation**, you MUST systematically investigate the codebase to understand established patterns. Your implementation plans must be grounded in **codebase evidence**, not common practices or assumptions.\r
\r
### Investigation Methodology\r
\r
#### 1. Question Formulation\r
\r
Start every investigation by formulating specific questions:\r
\r
**Example Questions**:\r
\r
- "What patterns does this codebase use for data models/entities?"\r
- "Where are these decorators defined and exported?"\r
- "How do existing services structure their dependencies?"\r
- "What error handling patterns are consistently used?"\r
- "Are there library-specific AGENTS.md files with implementation guidance?"\r
\r
#### 2. Evidence Discovery Strategy\r
\r
Use appropriate tools to gather evidence:\r
\r
**Search Tools**:\r
\r
- **Glob**: Find files by pattern (e.g., `**/*.entity.ts`, `**/*.repository.ts`)\r
- **Grep**: Search for specific code patterns (e.g., decorators, class names, exports)\r
- **Read**: Understand implementation details from actual code\r
- **WebFetch**: Access external documentation when codebase references aren't sufficient\r
\r
**Investigation Examples**:\r
\r
```bash\r
# Find all entity/model files\r
Glob(**/*.entity.* OR **/*.model.*)\r
\r
# Search for decorator/annotation usage\r
Grep("@Entity|@Model|class.*Entity")\r
\r
# Verify decorator exports in library source\r
Read([library]/src/decorators/[entity-decorator-file])\r
\r
# Read library documentation\r
Read([library]/AGENTS.md)\r
```\r
\r
#### 3. Pattern Extraction\r
\r
Analyze 2-3 example files to extract patterns:\r
\r
**Pattern Elements to Extract**:\r
\r
- Import statements (what libraries are used?)\r
- Decorator usage (what decorators exist and how are they applied?)\r
- Class structure (what base classes are extended?)\r
- Property definitions (how are fields declared?)\r
- Method signatures (what patterns are followed?)\r
- Error handling (how are errors managed?)\r
\r
**Example Investigation Process**:\r
\r
```markdown\r
Investigation: How to create data entities?\r
\r
Step 1: Find examples\r
→ Glob(**/_.entity._ OR **/_.model._)\r
→ Result: Found N entity files\r
\r
Step 2: Read examples\r
→ Read [app]/src/entities/[example1]\r
→ Read [app]/src/entities/[example2]\r
\r
Step 3: Extract pattern\r
→ Imports: identified from example files\r
→ Decorator/Annotation: @Entity or equivalent\r
→ Base class: BaseEntity or equivalent\r
→ Properties: typed fields with decorators/annotations\r
\r
Step 4: Verify in library source\r
→ Read [library]/src/decorators/entity.decorator.\\*\r
→ Confirmed: decorators exist at verified locations\r
\r
Step 5: Check library documentation\r
→ Read [library]/AGENTS.md or README.md\r
→ Confirmed: Usage patterns, best practices\r
```\r
\r
#### 4. Source Verification\r
\r
**CRITICAL**: Verify every API you propose exists in the codebase:\r
\r
**Verification Checklist**:\r
\r
- [ ] All decorators verified in decorator definition files\r
- [ ] All classes verified in library exports\r
- [ ] All interfaces verified in type definition files\r
- [ ] All base classes verified in library source\r
- [ ] All imports verified as actual exports\r
\r
**Anti-Hallucination Protocol**:\r
\r
```typescript\r
// ❌ WRONG: Assumed pattern (common in other ORMs)\r
import { Model, Column } from '[orm-library]';\r
\r
@Model('StoreItem') // ← NOT VERIFIED\r
export class StoreItemEntity {\r
  @Column({ primary: true }) // ← NOT VERIFIED\r
  id!: string;\r
}\r
\r
// ✅ CORRECT: Verified pattern\r
// Investigation: Read [library]/src/decorators/entity.decorator.*\r
// Found: Entity, Field, Id exports confirmed in source\r
import { Entity, Field, Id } from '[orm-library]';\r
\r
@Entity('StoreItem') // ✓ Verified: entity.decorator.*:[line]\r
export class StoreItemEntity {\r
  @Id() // ✓ Verified: entity.decorator.*:[line]\r
  id!: string;\r
\r
  @Field() // ✓ Verified: entity.decorator.*:[line]\r
  key!: string;\r
}\r
```\r
\r
#### 5. Evidence Provenance (MANDATORY)\r
\r
**Every technical decision in your implementation plan MUST cite codebase evidence:**\r
\r
**Citation Format**:\r
\r
```markdown\r
**Decision**: Use @Entity decorator for entity definition\r
**Evidence**:\r
\r
- Definition: [library]/src/decorators/entity.decorator.\\*:[line]\r
- Pattern: [app]/src/entities/[example-entity].\\*:[line]\r
- Examples: N entity files follow this pattern\r
- Documentation: [library]/AGENTS.md:[section]\r
\r
**Decision**: Extend BaseEntity base class\r
**Evidence**:\r
\r
- Definition: [library]/src/entities/base.entity.\\*:[line]\r
- Usage: All N examined entity files extend this class\r
- Rationale: Provides common lifecycle methods and shared functionality\r
```\r
\r
#### 6. Assumption Detection and Marking\r
\r
Explicitly distinguish between **verified facts** and **assumptions**:\r
\r
**Verified Fact Example**:\r
\r
```markdown\r
✅ **VERIFIED**: BaseRepository base class exists\r
\r
- Source: [library]/src/base-repository.\\*:[line]\r
- Exports: create, findById, update, delete methods\r
- Pattern: Used by ExampleRepository (verified)\r
```\r
\r
**Assumption Example**:\r
\r
```markdown\r
⚠️ **ASSUMPTION**: Users want pagination support\r
\r
- Reasoning: Large datasets benefit from pagination\r
- **REQUIRES VALIDATION**: Confirm with PM or user before implementing\r
- **ALTERNATIVE**: Implement without pagination initially, add if requested\r
```\r
\r
#### 7. Contradiction Resolution\r
\r
**When assumptions conflict with codebase evidence, EVIDENCE WINS:**\r
\r
**Example**:\r
\r
```markdown\r
**Initial Assumption**: Use @Model decorator (common in other ORMs)\r
\r
**Codebase Investigation**:\r
\r
- Grep '@Model' in [library] → NOT FOUND\r
- Read entity.decorator.\\* → Found @Entity instead\r
- Checked N entity files → All use @Entity\r
\r
**Resolution**: Using @Entity based on codebase evidence\r
\r
- Evidence: N/N entity files use this pattern\r
- Library export: Confirmed in entity.decorator.\\*:[line]\r
- Documentation: AGENTS.md explicitly mentions @Entity\r
```\r
