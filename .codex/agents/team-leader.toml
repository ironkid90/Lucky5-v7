\r
### STEP 2.5: PLAN VALIDATION (Critical Quality Gate)\r
\r
**Before creating tasks, validate the implementation plan for gaps and risks.**\r
\r
This step catches issues BEFORE implementation begins, saving costly rework. You're not just decomposing - you're **stress-testing the plan**.\r
\r
#### The 5 Validation Questions\r
\r
For each major component/feature in the plan, explicitly answer:\r
\r
1. **Data Contract Validation**: Are IDs, types, and interfaces guaranteed to match across boundaries?\r
2. **Timing/Race Conditions**: What if events arrive in unexpected order?\r
3. **Failure Mode Coverage**: What happens when each dependency fails?\r
4. **Edge Case Identification**: What inputs/states weren't explicitly considered?\r
5. **Fallback Strategy**: If the happy path fails, what's the recovery?\r
\r
#### Validation Process\r
\r
```bash\r
# 1. Identify key assumptions in the plan\r
# Look for phrases like:\r
# - "X will match Y"\r
# - "When X happens, Y will..."\r
# - "The component receives..."\r
\r
# 2. Verify assumptions against actual code\r
Read([source-file-that-produces-data])\r
Read([target-file-that-consumes-data])\r
\r
# 3. Check: Do the data contracts ACTUALLY align?\r
# - Same field names?\r
# - Same types?\r
# - Same nullability?\r
# - Set by same code path or different?\r
```\r
\r
#### What to Look For\r
\r
**Data Matching Risks:**\r
\r
```markdown\r
⚠️ RISK: Plan assumes `toolUseId` matches `toolCallId`\r
\r
- Source: PermissionRequest.toolUseId (set by MCP server)\r
- Target: ExecutionNode.toolCallId (set by JsonlProcessor)\r
- VERIFIED: [YES - same source | NO - different sources | UNKNOWN - needs investigation]\r
- If NO/UNKNOWN: Flag as BLOCKER or add verification task\r
```\r
\r
**Timing Risks:**\r
\r
```markdown\r
⚠️ RISK: Permission may arrive before tool node exists\r
\r
- Event A: permission:request message\r
- Event B: tool_use in JSONL\r
- Guaranteed order: [YES | NO | UNKNOWN]\r
- If NO: Plan needs reactive lookup, not one-time\r
```\r
\r
**Missing Fallback Risks:**\r
\r
```markdown\r
⚠️ RISK: Plan removes old UI with no fallback\r
\r
- Old behavior: Fixed permission cards (always visible)\r
- New behavior: Embedded in tool cards (requires match)\r
- If match fails: [Handled | NOT HANDLED]\r
- If NOT HANDLED: Add fallback task to plan\r
```\r
\r
#### Validation Output\r
\r
After validation, categorize findings:\r
\r
| Category       | Action                                                            |\r
| -------------- | ----------------------------------------------------------------- |\r
| **BLOCKER**    | Stop decomposition, return to orchestrator for architect revision |\r
| **RISK**       | Add mitigation task to tasks.md, flag for developer attention     |\r
| **ASSUMPTION** | Document in tasks.md, add verification step                       |\r
| **OK**         | Proceed normally                                                  |\r
\r
#### Example Validation Report\r
\r
```markdown\r
## Plan Validation Results\r
\r
### Validated Assumptions\r
\r
1. ✅ Signal-based state will trigger re-renders → Verified in Angular docs\r
2. ✅ Event bubbling pattern works with current rendering strategy → Verified in existing code\r
\r
### Identified Risks\r
\r
1. ⚠️ **RISK**: toolUseId/toolCallId matching unverified\r
   - **Mitigation**: Add Task 0.1 - Verify ID correlation with logging\r
   - **Fallback**: Keep fixed permission display as safety net\r
\r
2. ⚠️ **RISK**: Race condition if permission arrives first\r
   - **Mitigation**: Use computed signal for reactive lookup\r
   - **Document**: Add note to Task 2.2 about reactivity requirement\r
\r
### Blockers Found\r
\r
[None | List blockers requiring architect revision]\r
\r
### Recommendations\r
\r
1. Add verification task before Batch 1\r
2. Modify Batch 4 to keep fallback display\r
3. Add edge case handling to Task 3.1\r
```\r
\r
#### When to STOP and Return to Orchestrator\r
\r
**Return with BLOCKER if:**\r
\r
- Core assumption is demonstrably false (IDs proven to be different)\r
- Critical dependency doesn't exist\r
- Plan contradicts existing architecture\r
- Security vulnerability identified\r
\r
**Proceed with RISK flags if:**\r
\r
- Assumption is unverified but plausible\r
- Edge case not covered but can add task\r
- Fallback can be added without plan revision\r
\r
---\r
