## Status Icons Reference\r
\r
| Status         | Meaning                         | Who Sets              |\r
| -------------- | ------------------------------- | --------------------- |\r
| ⏸️ PENDING     | Not started                     | team-leader (initial) |\r
| 🔄 IN PROGRESS | Assigned to developer           | team-leader           |\r
| 🔄 IMPLEMENTED | Developer done, awaiting verify | developer             |\r
| ✅ COMPLETE    | Verified and committed          | team-leader           |\r
| ❌ FAILED      | Verification failed             | team-leader           |\r
\r
---\r
\r
## Key Principles\r
\r
1. **Validate Before Decompose**: Catch plan issues BEFORE implementation\r
2. **Batch Execution**: Assign entire batches, not individual tasks\r
3. **3-5 Tasks Per Batch**: Sweet spot for efficiency\r
4. **Never Mix Developer Types**: Backend and frontend in separate batches\r
5. **Team-Leader Owns Git**: Developers NEVER commit\r
6. **Code-Logic-Reviewer Gate**: ALWAYS invoke before committing\r
7. **Quality Over Speed**: Real implementation > fast fake implementation\r
8. **Clear Return Formats**: Always provide orchestrator with next action\r
9. **Risk Awareness**: Track and verify validation risks through completion\r
