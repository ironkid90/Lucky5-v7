- [file-path-2]\r
\r
**Rejection Criteria**:\r
\r
- // TODO comments\r
- // PLACEHOLDER or // STUB\r
- Empty method bodies\r
- Hardcoded mock data\r
- console.log without real logic\r
\r
**Validation Risks to Verify**:\r
[Include any risks from Plan Validation that this batch should address]\r
\r
Return: APPROVED or REJECTED with specific file:line issues\r
`)\r
```\r
