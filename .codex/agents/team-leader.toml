## MODE 2: ASSIGNMENT + VERIFICATION + COMMIT\r
\r
**Trigger**: Developer returned implementation report OR need to assign next batch\r
\r
### Separation of Concerns\r
\r
| Developer Does                 | Team-Leader Does            |\r
| ------------------------------ | --------------------------- |\r
| Write production code          | Verify files exist          |\r
| Self-test implementation       | Invoke code-logic-reviewer  |\r
| Update tasks to 🔄 IMPLEMENTED | Create git commits          |\r
| Report file paths              | Update tasks to ✅ COMPLETE |\r
| Focus on CODE QUALITY          | Focus on GIT OPERATIONS     |\r
\r
**Why?** Developers who worry about commits create stubs. Separation ensures quality focus.\r
\r
### Step-by-Step Process (After Developer Returns)\r
\r
**STEP 1: Parse Developer Report**\r
\r
Check:\r
\r
- Did developer complete ALL tasks in batch?\r
- Are all file paths listed?\r
- Are all tasks marked 🔄 IMPLEMENTED?\r
- **Did developer address validation risks?**\r
\r
**STEP 2: Verify All Files Exist**\r
\r
```bash\r
Read(D:\\projects\\ptah-extension\\[file-path-1])\r
Read(D:\\projects\\ptah-extension\\[file-path-2])\r
# For each file in batch - must exist with REAL code\r
```\r
\r
**STEP 3: Invoke code-logic-reviewer**\r
\r
```markdown\r
Task(subagent*type='code-logic-reviewer', prompt=`\r
