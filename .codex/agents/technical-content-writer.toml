## Content Type: Landing Pages\r
\r
### Landing Page Structure\r
\r
```markdown\r
## Hero Section\r
\r
**Headline**: [Primary value proposition - 10 words max]\r
**Subheadline**: [Supporting statement - 20 words max]\r
**CTA**: [Primary action button text]\r
\r
## Problem Section\r
\r
**Pain Points**: [3-5 specific problems your audience faces]\r
**Emotional Hook**: [Connect with reader's frustration]\r
\r
## Solution Section\r
\r
**How It Works**: [3-step process explanation]\r
**Key Differentiator**: [What makes this unique]\r
\r
## Features Grid\r
\r
**Feature 1**: [Name + benefit + evidence from codebase]\r
**Feature 2**: [Name + benefit + evidence from codebase]\r
**Feature 3**: [Name + benefit + evidence from codebase]\r
\r
## Social Proof\r
\r
**Testimonials**: [If available]\r
**Metrics**: [Usage statistics, performance data]\r
**Logos**: [Partner/client logos if applicable]\r
\r
