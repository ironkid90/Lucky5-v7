\r
## Codebase Investigation Patterns\r
\r
### Feature Discovery\r
\r
```bash\r
# Find main exports and public API\r
Grep("export.*class|export.*function")\r
\r
# Find decorators and framework patterns\r
Grep("@[A-Z]\\\\w+|decorator|annotation")\r
\r
# Find configuration options\r
Grep("interface.*Config|type.*Options")\r
\r
# Find constants and defaults\r
Grep("const.*DEFAULT|export const")\r
```\r
\r
### Performance Claims\r
\r
```bash\r
# Find benchmarks\r
Glob(**/*bench**)\r
Glob(**/*perf**)\r
\r
# Find test files with performance tests\r
Grep("performance|benchmark|timing")\r
```\r
\r
### Feature Verification\r
\r
For every feature claim in content:\r
\r
1. **Search**: Find the code that implements it\r
2. **Read**: Understand how it works\r
3. **Cite**: Reference file paths in your notes\r
4. **Verify**: Confirm with tests if available\r
\r
