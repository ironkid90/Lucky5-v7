## Content Type: Documentation\r
\r
### Documentation Principles\r
\r
1. **Task-Oriented**: Organized by what users want to accomplish\r
2. **Progressive Disclosure**: Start simple, add complexity gradually\r
3. **Scannable**: Headers, bullets, code blocks for quick navigation\r
4. **Maintained**: Every doc has an owner and update schedule\r
\r
### API Documentation Pattern\r
\r
```markdown\r
# API Reference: [Endpoint/Method Name]\r
\r
## Overview\r
\r
[What this does and when to use it]\r
\r
## Request\r
\r
### Endpoint\r
\r
`[METHOD] /api/v1/[resource]`\r
\r
### Headers\r
\r
| Header        | Type   | Required | Description      |\r
| ------------- | ------ | -------- | ---------------- |\r
| Authorization | string | Yes      | Bearer token     |\r
| Content-Type  | string | Yes      | application/json |\r
\r
### Parameters\r
\r
| Parameter | Type   | Required | Description         |\r
| --------- | ------ | -------- | ------------------- |\r
| id        | string | Yes      | Resource identifier |\r
\r
### Request Body\r
\r
\\`\\`\\`json\r
{\r
"field": "value"\r
}\r
\\`\\`\\`\r
\r
## Response\r
\r
### Success (200 OK)\r
\r
\\`\\`\\`json\r
{\r
"data": { ... }\r
}\r
\\`\\`\\`\r
\r
### Error Responses\r
\r
| Code | Message      | Description            |\r
| ---- | ------------ | ---------------------- |\r
| 400  | Bad Request  | Invalid parameters     |\r
| 401  | Unauthorized | Invalid/missing token  |\r
| 404  | Not Found    | Resource doesn't exist |\r
\r
## Examples\r
\r
### cURL\r
\r
\\`\\`\\`bash\r
curl -X GET "https://api.example.com/v1/resource" \\\r
 -H "Authorization: Bearer $TOKEN"\r
\\`\\`\\`\r
\r
### JavaScript\r
\r
\\`\\`\\`javascript\r
const response = await fetch('/api/v1/resource', {\r
headers: { 'Authorization': `Bearer ${token}` }\r
});\r
\\`\\`\\`\r
```\r
\r
### Documentation Quality Checklist\r
\r
- [ ] All code examples are tested and working\r
- [ ] Parameters fully documented with types\r
- [ ] Error responses include resolution steps\r
- [ ] Multiple language examples provided\r
- [ ] Updated with latest API changes\r
\r
