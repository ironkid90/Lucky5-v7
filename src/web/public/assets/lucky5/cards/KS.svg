<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" role="img" aria-labelledby="title desc">
  <title id="title">Lucky5 K SPADE</title>
  <desc id="desc">Original Lucky5 retro cabinet card face for K of spades.</desc>
  <style>
    .rank,.suit,.pip,.face,.face-suit{fill:#111111;font-family:Lucky5Arcade,'Courier New',monospace;font-weight:700}
    .rank{font-size:19px}.suit{font-size:18px}.pip{font-size:18px}.face{font-size:46px}.face-suit{font-size:25px}
    .micro{font-size:5px;fill:#8f5f1d;font-family:Lucky5Arcade,'Courier New',monospace;letter-spacing:.5px}
  </style>
  <rect x="2" y="2" width="96" height="146" rx="8" fill="#fff7df" stroke="#261607" stroke-width="3"/>
  <rect x="6" y="6" width="88" height="138" rx="5" fill="none" stroke="#d5a13d" stroke-width="1.5"/>
  <path d="M11 18h22M67 132h22" stroke="#f2c35e" stroke-width="2"/>
  <g>
    <text x="15" y="22" text-anchor="middle" class="rank">K</text>
    <text x="15" y="39" text-anchor="middle" class="suit">♠</text>
  </g>
  <g transform="rotate(180 50 75)">
    <text x="15" y="22" text-anchor="middle" class="rank">K</text>
    <text x="15" y="39" text-anchor="middle" class="suit">♠</text>
  </g>
  <g><text x="50" y="52" text-anchor="middle" dominant-baseline="middle" class="face">K</text>
    <text x="50" y="70" text-anchor="middle" dominant-baseline="middle" class="face-suit">♠</text></g>
  
</svg>
